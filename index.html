<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c4c4c;
    --surface: #15221f;
    --surface-2: #1c2c29;
    --line: #2a3b37;
    --text: #eae6dd;
    --text-dim: #9fb0ab;
    --sage: #86a996;
    --sage-soft: #438262;
    --blush: #e3b6a0;
    --blush-soft: #b07960;
    --focus: #bae1ca;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    font-weight:400;
    overflow:hidden;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  button{font-family:inherit;}
  ::selection{background:var(--sage-soft); color:var(--bg);}

  #app{
    display:grid;
    grid-template-columns:240px 1fr;
    height:100vh;
    width:100vw;
  }

  #sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:28px 20px;
    display:flex;
    flex-direction:column;
    gap:28px;
    overflow-y:auto;
  }
  #brand{display:flex; flex-direction:column; gap:2px;}
  #brand h1{font-size:26px; font-weight:500; margin:0; letter-spacing:0.01em;}
  #brand span{font-size:12px; color:var(--text-dim); letter-spacing:0.02em;}

  .side-label{font-size:11px; color:var(--text-dim); margin-bottom:10px; letter-spacing:0.04em;}

  #modes{display:flex; flex-direction:column; gap:6px;}
  .mode-btn{
    text-align:left;
    background:transparent;
    border:1px solid transparent;
    color:var(--text-dim);
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    flex-direction:column;
    gap:2px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .mode-btn strong{font-family:'Fraunces', serif; font-weight:500; font-size:15px; color:var(--text);}
  .mode-btn small{font-size:11.5px; color:var(--text-dim); line-height:1.3;}
  .mode-btn:hover{background:var(--surface-2);}
  .mode-btn.active{border-color:var(--sage-soft); background:rgba(134,169,150,0.12);}
  .mode-btn.active strong{color:var(--sage);}

  .side-block{display:flex; flex-direction:column; gap:10px;}
  select, input[type=text], input[type=password]{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
    width:100%;
  }
  select:focus, input:focus{outline:2px solid var(--focus); outline-offset:1px;}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-dim);}
  .switch{
    width:38px; height:22px; border-radius:20px; background:var(--surface-2);
    border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--text-dim); transition:transform .18s ease, background .18s ease;
  }
  .switch.on{background:rgba(134,169,150,0.25); border-color:var(--sage-soft);}
  .switch.on .knob{transform:translateX(16px); background:var(--sage);}

  #utility-btns{display:flex; flex-direction:column; gap:6px; margin-top:auto;}
  .ghost-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; text-align:left;
  }
  .ghost-btn:hover{border-color:var(--sage-soft); color:var(--text);}

  #main{display:flex; flex-direction:column; height:100vh; position:relative;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
  }
  #mode-title{font-size:15px; color:var(--text-dim);}
  #mode-title strong{color:var(--text); font-family:'Fraunces',serif; font-weight:500; font-size:17px;}
  #mood-track{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .mood-dot{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line); cursor:pointer;
    background:var(--surface-2); font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .mood-dot.sel{border-color:var(--sage); background:rgba(134,169,150,0.25);}

  #chat{
    flex:1; overflow-y:auto; padding:32px 28px 12px 28px;
    display:flex; flex-direction:column; gap:16px;
  }
  .msg{max-width:640px; padding:13px 16px; border-radius:14px; font-size:14.5px; line-height:1.55;}
  .msg.user{align-self:flex-end; background:var(--surface-2); border:1px solid var(--line); border-bottom-right-radius:4px;}
  .msg.haven{align-self:flex-start; background:rgba(134,169,150,0.10); border:1px solid rgba(134,169,150,0.25); border-bottom-left-radius:4px;}
  .msg .who{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:5px; display:block;}
  .msg.haven .who{color:var(--sage);}
  .empty-state{
    margin:auto; text-align:center; color:var(--text-dim); max-width:380px; font-size:14px; line-height:1.6;
  }
  .empty-state h2{color:var(--text); font-weight:500; font-size:20px; margin-bottom:8px;}

  #composer{
    padding:16px 28px 24px 28px; border-top:1px solid var(--line);
    display:flex; gap:10px; align-items:flex-end;
  }
  #textbox{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-family:inherit; font-size:14.5px; padding:12px 14px;
    resize:none; max-height:140px; line-height:1.5;
  }
  #textbox:focus{outline:2px solid var(--focus); outline-offset:1px;}
  .round-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    transition:background .15s ease, border-color .15s ease;
  }
  .round-btn:hover{border-color:var(--sage-soft);}
  .round-btn.mic.listening{background:rgba(227,182,160,0.25); border-color:var(--blush-soft); color:var(--blush);}
  .round-btn.send{background:var(--sage-soft); border-color:var(--sage-soft); color:#0d1512;}
  .round-btn.send:hover{background:var(--sage);}

  #breathe-overlay{
    position:absolute; inset:0; background:rgba(8,12,12,0.92); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:22px; z-index:20;
  }
  #breathe-overlay.show{display:flex;}
  #breath-circle{
    width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(134,169,150,0.55), rgba(134,169,150,0.12));
    border:1px solid rgba(134,169,150,0.5);
    transform:scale(0.7); transition:transform 4s ease-in-out;
  }
  #breath-word{font-family:'Fraunces',serif; font-size:20px; color:var(--text);}
  .ghost-btn.light{color:var(--text-dim);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:8px;}

  @media (max-width:720px){
    #app{grid-template-columns:1fr;}
    #sidebar{position:fixed; z-index:30; left:0; top:0; bottom:0; width:240px; transform:translateX(-100%); transition:transform .2s ease;}
    #sidebar.open{transform:translateX(0);}
    #topbar{padding:14px 16px;}
    #chat{padding:20px 16px;}
    #composer{padding:12px 16px 18px 16px;}
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <h1>Assistant</h1>
      <span>a quiet place to talk it out</span>
    </div>

    <div class="side-block">
      <div class="side-label">MODE</div>
      <div id="modes"></div>
    </div>

    <div class="side-block">
      <div class="side-label">VOICE</div>
      <select id="voiceSelect"></select>
      <div class="toggle-row">
        <span>Speak replies aloud</span>
        <div class="switch" id="speakToggle"><div class="knob"></div></div>
      </div>
    </div>

    <div class="side-block">
      <div class="side-label">GEMINI API KEY (FREE)</div>
      <input type="password" id="apiKey" placeholder="AIza...">
      <span style="font-size:11px;color:var(--text-dim);">Free from aistudio.google.com — no card needed. Stored only in this browser.</span>
    </div>

    <div id="utility-btns">
      <button class="ghost-btn" id="breatheBtn">Take a breathing pause</button>
      <button class="ghost-btn" id="newChatBtn">Start a new conversation</button>
      <button class="ghost-btn" id="exportBtn">Export conversation (.txt)</button>
      <button class="ghost-btn" id="clearBtn">Clear all saved data</button>
    </div>
  </aside>

  <main id="main">
    <div id="breathe-overlay">
      <div id="breath-circle"></div>
      <div id="breath-word">Breathe in…</div>
      <button class="ghost-btn light" id="breatheClose">Done</button>
    </div>

    <div id="topbar">
      <div id="mode-title">You're in <strong id="modeName">Reflect</strong> mode</div>
      <div id="mood-track">
        <span>Mood today:</span>
        <div class="mood-dot" data-v="1">😞</div>
        <div class="mood-dot" data-v="2">😕</div>
        <div class="mood-dot" data-v="3">😐</div>
        <div class="mood-dot" data-v="4">🙂</div>
        <div class="mood-dot" data-v="5">😊</div>
      </div>
    </div>

    <div id="chat"></div>

    <div id="composer">
      <button class="round-btn mic" id="micBtn" title="Speak instead of typing">🎙️</button>
      <textarea id="textbox" rows="1" placeholder="Say whatever's on your mind…"></textarea>
      <button class="round-btn send" id="sendBtn" title="Send">➤</button>
    </div>
  </main>
</div>

<script>
/* ---------------- Config / State ---------------- */
const SAFETY_CLAUSE = ` You are not a doctor, therapist, or emergency service, and you never diagnose conditions. If the person expresses intent to seriously harm themselves or someone else, prioritize their immediate safety above anything else: gently but clearly encourage them to contact emergency services or a crisis line in their location right now, to move away from anything they could use to harm themselves, and to reach out to a trusted person who can be with them. Do not provide instructions related to self-harm, suicide, or violence under any circumstances.`;

const MODES = {
  rant: {
    label: "Rant",
    desc: "Just let it out, no fixing",
    systemPrompt: `You are Assistant, a warm, human-sounding listener in "Rant mode." The person just needs to vent without being fixed, judged, or redirected — they're allowed to be messy, angry, or use strong language, and you never shame them for it or mirror hostility back. Mirror their emotion, validate what they're feeling, ask at most one short follow-up question if it helps them keep going. Do NOT give advice or silver linings unless they explicitly ask for it. Keep replies short (2-5 sentences), conversational, never clinical or robotic.` + SAFETY_CLAUSE
  },
  reflect: {
    label: "Reflect",
    desc: "Think it through together",
    systemPrompt: `You are Assistant, a thoughtful, kind friend in "Reflect mode." Help the person understand their own feelings and situation more clearly by gently separating what happened, what they feel, what they think it means, and what they actually need. Ask open, curious questions, gently name patterns you notice, and reflect their words back so they can hear themselves think. Do not rush to solutions. Keep replies warm, short-to-medium (3-6 sentences), never clinical.` + SAFETY_CLAUSE
  },
  advice: {
    label: "Advice",
    desc: "Practical next steps",
    systemPrompt: `You are Assistant, a caring and grounded companion in "Advice mode." The person wants practical, concrete guidance. Briefly acknowledge the feeling, then offer clear, small, realistic next steps rather than vague positivity, and end with one gentle question to check what would actually help them. Keep it actionable but warm, not clinical, 3-6 sentences.` + SAFETY_CLAUSE
  }
};

const state = {
  mode: localStorage.getItem('haven_mode') || 'reflect',
  speakEnabled: localStorage.getItem('haven_speak') === 'true',
  voiceURI: localStorage.getItem('haven_voice') || '',
  apiKey: localStorage.getItem('haven_apikey') || '',
  messages: JSON.parse(localStorage.getItem('haven_messages') || '[]')
};

document.getElementById('apiKey').value = state.apiKey;

/* ---------------- Mode buttons ---------------- */
const modesEl = document.getElementById('modes');
Object.entries(MODES).forEach(([key, m]) => {
  const btn = document.createElement('button');
  btn.className = 'mode-btn' + (key === state.mode ? ' active' : '');
  btn.dataset.mode = key;
  btn.innerHTML = `<strong>${m.label}</strong><small>${m.desc}</small>`;
  btn.onclick = () => setMode(key);
  modesEl.appendChild(btn);
});
function setMode(key){
  state.mode = key;
  localStorage.setItem('haven_mode', key);
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === key));
  document.getElementById('modeName').textContent = MODES[key].label;
}
setMode(state.mode);

/* ---------------- Chat rendering ---------------- */
const chatEl = document.getElementById('chat');
function renderChat(){
  chatEl.innerHTML = '';
  if(state.messages.length === 0){
    chatEl.innerHTML = `<div class="empty-state"><h2>Welcome to Assistant</h2>Nothing you say here needs an account, a login, or anyone else knowing. Pick a mode on the left and start typing or talking.</div>`;
    return;
  }
  state.messages.forEach(m => addMsgEl(m.role, m.text, false));
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addMsgEl(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'haven');
  div.innerHTML = `<span class="who">${role === 'user' ? 'You' : 'Assistant'}</span>${escapeHtml(text)}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function saveMessages(){
  localStorage.setItem('haven_messages', JSON.stringify(state.messages));
}
renderChat();

/* ---------------- Sending messages ---------------- */
const textbox = document.getElementById('textbox');
const sendBtn = document.getElementById('sendBtn');

textbox.addEventListener('input', () => {
  textbox.style.height = 'auto';
  textbox.style.height = Math.min(textbox.scrollHeight, 140) + 'px';
});
textbox.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.onclick = sendMessage;

async function sendMessage(){
  const text = textbox.value.trim();
  if(!text) return;
  textbox.value = '';
  textbox.style.height = 'auto';

  state.messages.push({role:'user', text});
  saveMessages();
  renderChat();

  const key = document.getElementById('apiKey').value.trim();
  if(!key){
    const warn = "I need a free Gemini API key before I can reply — get one at aistudio.google.com (no card needed) and paste it into the sidebar.";
    state.messages.push({role:'assistant', text: warn});
    saveMessages(); renderChat();
    return;
  }

  const thinkingId = 'thinking-' + Date.now();
  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'msg haven';
  thinkDiv.id = thinkingId;
  thinkDiv.innerHTML = `<span class="who">Assistant</span>…`;
  chatEl.appendChild(thinkDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  try{
    const history = state.messages.slice(-16).map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: MODES[state.mode].systemPrompt }] },
        contents: history
      })
    });
    const data = await res.json();
    document.getElementById(thinkingId)?.remove();

    let reply;
    if(data.candidates && data.candidates.length && data.candidates[0].content){
      reply = data.candidates[0].content.parts.map(p => p.text || '').join('\n').trim();
    } else if (data.error){
      reply = "Something went wrong reaching Gemini: " + data.error.message;
    } else {
      reply = "I didn't get a usable reply — please try again.";
    }
    state.messages.push({role:'assistant', text: reply});
    saveMessages();
    renderChat();
    if(state.speakEnabled) speak(reply);
  } catch(err){
    document.getElementById(thinkingId)?.remove();
    state.messages.push({role:'assistant', text: "I couldn't reach Gemini just now (" + err.message + "). Check your connection and API key."});
    saveMessages();
    renderChat();
  }
}

/* ---------------- Mood tracker ---------------- */
document.querySelectorAll('.mood-dot').forEach(d => {
  d.onclick = () => {
    document.querySelectorAll('.mood-dot').forEach(x => x.classList.remove('sel'));
    d.classList.add('sel');
    const log = JSON.parse(localStorage.getItem('haven_moods') || '[]');
    log.push({date: new Date().toISOString(), value: d.dataset.v});
    localStorage.setItem('haven_moods', JSON.stringify(log));
  };
});

/* ---------------- Voice: speech synthesis (talk back) ---------------- */
const voiceSelect = document.getElementById('voiceSelect');
function populateVoices(){
  const voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  voices.filter(v => ['en-CA','en-GB','en-AU'].includes(v.lang)).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})`;
    if(v.voiceURI === state.voiceURI) opt.selected = true;
    voiceSelect.appendChild(opt);
  });
}
speechSynthesis.onvoiceschanged = populateVoices;
populateVoices();
voiceSelect.onchange = () => {
  state.voiceURI = voiceSelect.value;
  localStorage.setItem('haven_voice', state.voiceURI);
};
function speak(text){
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const chosen = voices.find(v => v.voiceURI === state.voiceURI);
  if(chosen) utter.voice = chosen;
  utter.rate = 0.98;
  utter.pitch = 1.0;
  speechSynthesis.speak(utter);
}

const speakToggle = document.getElementById('speakToggle');
function syncSwitch(el, on){ el.classList.toggle('on', on); }
syncSwitch(speakToggle, state.speakEnabled);
speakToggle.onclick = () => {
  state.speakEnabled = !state.speakEnabled;
  localStorage.setItem('haven_speak', state.speakEnabled);
  syncSwitch(speakToggle, state.speakEnabled);
};

/* ---------------- Voice input (speech recognition) ---------------- */
const micBtn = document.getElementById('micBtn');
let recognition = null;
let listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    textbox.value = (textbox.value ? textbox.value + ' ' : '') + said;
  };
  recognition.onend = () => { listening = false; micBtn.classList.remove('listening'); };
  recognition.onerror = (e) => {
    listening = false;
    micBtn.classList.remove('listening');
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      alert("Assistant needs microphone permission. Click the padlock/site-info icon in your address bar and allow the microphone, then try again.");
    }
  };
  micBtn.onclick = () => {
    if(listening){ recognition.stop(); return; }
    listening = true;
    micBtn.classList.add('listening');
    recognition.start();
  };
} else {
  micBtn.title = 'Voice input not supported in this browser';
  micBtn.style.opacity = 0.4;
}

/* ---------------- API key persistence ---------------- */
document.getElementById('apiKey').addEventListener('change', (e) => {
  state.apiKey = e.target.value.trim();
  localStorage.setItem('haven_apikey', state.apiKey);
});

/* ---------------- Breathing pause ---------------- */
const overlay = document.getElementById('breathe-overlay');
const circle = document.getElementById('breath-circle');
const word = document.getElementById('breath-word');
let breatheTimer = null;
document.getElementById('breatheBtn').onclick = () => {
  overlay.classList.add('show');
  let phase = 0;
  const steps = [
    {w:'Breathe in…', scale:1.25, ms:4000},
    {w:'Hold…', scale:1.25, ms:4000},
    {w:'Breathe out…', scale:0.7, ms:5000}
  ];
  function run(){
    const s = steps[phase % steps.length];
    word.textContent = s.w;
    circle.style.transition = `transform ${s.ms}ms ease-in-out`;
    circle.style.transform = `scale(${s.scale})`;
    phase++;
    breatheTimer = setTimeout(run, s.ms);
  }
  run();
};
document.getElementById('breatheClose').onclick = () => {
  overlay.classList.remove('show');
  clearTimeout(breatheTimer);
};

/* ---------------- New conversation / Export / Clear ---------------- */
document.getElementById('newChatBtn').onclick = () => {
  state.messages = [];
  saveMessages();
  renderChat();
};
document.getElementById('exportBtn').onclick = () => {
  const lines = state.messages.map(m => `${m.role === 'user' ? 'You' : 'Assistant'}: ${m.text}`);
  const blob = new Blob([lines.join('\n\n')], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `haven-conversation-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
};
document.getElementById('clearBtn').onclick = () => {
  if(confirm('This will permanently delete everything Assistant has saved on this device. Continue?')){
    localStorage.removeItem('haven_messages');
    localStorage.removeItem('haven_moods');
    state.messages = [];
    renderChat();
  }
};
</script>
</body>
</html>
